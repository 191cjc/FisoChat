# Include in your HTTPS server block. Only these public routes are proxied.
# /internal/group-messages is for local command-line use only.
location = /fisochat {
    return 302 /fisochat/group-messages;
}

location = /fisochat/ {
    return 302 /fisochat/group-messages;
}

location = /fisochat/group-messages {
    proxy_pass http://127.0.0.1:8789/group-messages;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 2s;
    proxy_read_timeout 130s;
    client_max_body_size 16k;
}

location = /fisochat/health {
    proxy_pass http://127.0.0.1:8789/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location ^~ /fisochat/ {
    return 404;
}
