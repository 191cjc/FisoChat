# Include in the HTTPS server block. Never proxy /internal routes.
location = /fisochat {
    return 404;
}

location = /fisochat/ {
    return 404;
}

location = /fisochat/health {
    proxy_pass http://127.0.0.1:8789/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location ^~ /fisochat/stickers/ {
    proxy_pass http://127.0.0.1:8789/stickers/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    client_max_body_size 1k;
}

location ^~ /fisochat/ {
    return 404;
}
